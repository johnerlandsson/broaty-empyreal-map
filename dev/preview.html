<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Map preview</title>
  <link rel="stylesheet" href="../ui/map.css">
  <style>
    /* the panel markup below is a copy of ui/map.html's, under a small control bar */
    body { display: flex; flex-direction: column; }
    .bar { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; height: 30px; padding: 0 8px; background: #0b0f16; }
    .bar button { font: 600 12px system-ui, sans-serif; padding: 3px 10px; border-radius: 5px; border: 1px solid #c98a2e; background: #ffb347; color: #3a2200; cursor: pointer; }
    .bar select { font: 11px system-ui, sans-serif; background: #1b2330; color: #e3eaf2; border: 1px solid #3b4a5c; border-radius: 4px; }
    .bar span { font: 11px "DejaVu Sans Mono", monospace; color: #8a96a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .station { flex: 1 1 auto; height: auto; min-height: 0; }
    #debug { position: fixed; right: 4px; bottom: 30px; max-width: 70%; margin: 0; font: 9px monospace; color: #9fe39f; background: #000a; pointer-events: none; white-space: pre-wrap; }
    #debug:empty { display: none; }
  </style>
</head>
<body>
  <div class="bar"><button id="walk" type="button">▶ Walk</button><select id="scene" title="Overview scene"><option>station</option><option>parked</option><option>travelling</option><option>belt</option><option>port-day</option><option>port-night</option><option>orbit-day</option><option>orbit-night</option><option>orbit-unknown</option></select><select id="work" title="The ship's work at a belt"><option value="">(work)</option><option>idle</option><option>scanning</option><option>assaying</option><option>mining</option></select><select id="move" title="Her moving in a belt"><option value="">(move)</option><option>rcs-out</option><option>closing-cut</option><option>halted</option></select><select id="hull" title="Ship's hull"><option value="">(none)</option><option>skiff</option><option>courier</option><option>freighter</option><option>tug</option></select><select id="chart" title="Chart scenario"><option value="">(off)</option><option>parked-gannet</option><option>under-way-orrin</option><option>searching-cinders</option><option>at-point</option><option>docked-tiss</option><option>landed-zennor</option><option>none</option><option>maelor</option><option>maelor-lanes</option><option>edge</option><option>to-mouth</option><option>adrift</option><option>from-stop</option><option>to-tamsin</option><option>high-orbit</option><option>high-orbit-unknown</option><option>sweep</option><option>chase</option></select><select id="course" title="A plotted course (opens the chart)"><option value="">(course)</option><option>cinders-tiss</option><option>ragged-orrin</option><option>contact</option><option>from-orbit</option><option>under-way</option></select><select id="lanes" title="Lanes scenario"><option value="">(off)</option><option>senara</option><option>in-trunk</option><option>in-mid</option><option>dozmary</option><option>petroc</option><option>new</option><option>partly</option></select><select id="belt" title="Belt map scenario"><option value="">(belt)</option><option>arriving</option><option>rcs-rim</option><option>sweeps</option><option>skiff</option><option>freighter-seen</option><option>docked-pair</option><option>compass</option><option>worked</option></select><select id="manoeuvre" title="Dock or undock (aboard the Magpie)"><option value="">(manoeuvre)</option><option>undock-tiss</option><option>dock-orrin</option></select><select id="sky" title="Zennor's sky (puts you in the Square)"><option value="">(sky)</option><option>night</option><option>dusk</option><option>dawn</option><option>low</option><option>overhead</option><option>tiss-overhead</option></select><select id="action" title="What you're doing"><option value="">(doing)</option><option>climbing-tiss</option><option>repair-skiff</option><option>drag-orrin</option></select><span id="status"></span></div>
  <main class="station">
    <div id="model" class="band"></div>
    <div class="separator" aria-hidden="true"></div>
    <div id="deck" class="band"></div>
    <div id="info" aria-live="polite"></div>
  </main>
  <pre id="debug"></pre>
  <script src="fake-panel.js"></script>
  <script type="module" src="preview.js"></script>
  <script type="module" src="../ui/main.js"></script>
</body>
</html>
