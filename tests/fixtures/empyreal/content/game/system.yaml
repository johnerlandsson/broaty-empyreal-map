# A star, a tilted planet with a port on it, and a station over it.
bodies:
  - id: sol
    name: Sol
    kind: star
    radius: 800
    temperature: 5800
    frame: { a: 6000, period: 2592000 }
  - id: rock
    name: Rock
    kind: planet
    orbit: { parent: sol, a: 6000 }
    radius: 400
    day: 18000
    equinox: 90
    tilt: 20
  - id: mini
    name: Mini Outpost
    kind: station
    orbit: { parent: rock, a: 900 }
  - id: pit
    name: The Pit
    kind: port
    surface: { parent: rock, bearing: 0, latitude: 40 }
