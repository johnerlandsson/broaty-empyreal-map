<!doctype html>
<!-- Closed lane mouths, 2026-10-23: three looks for a mouth whose lane is closed (Space.Charts' `open` false).
     Maelor's system at day 60 of the galaxy's year (galaxy.yaml): trunks to Senara (287.0°) and Elowen
     (198.6°), and the Petroc branch (287.8°), closed. Each option: the whole system, the off-view markers
     docked at Wenna Halt, and the closed mouth's tooltip. All three share the crowding fix: mouths closer
     than 18 px are spread along the edge, their names stacked; off-view markers that land together become
     one chevron with a line a mouth. A throwaway: take its look, not its code. -->
<html><head><meta charset="utf-8"><title>Closed lane mouths: options</title>
<style>
  body { margin:0; background:#04060c; color:#7d8a9a; font:13px Inter, system-ui, sans-serif; padding:18px; }
  .row { display:flex; gap:26px; justify-content:center; align-items:flex-start; }
  figure { margin:0; text-align:center; }
  figcaption { margin:8px 0 2px; color:#e3eaf2; font-size:14px; }
  figcaption small { display:block; color:#7d8a9a; max-width:360px; margin:4px auto 0; font-size:12px; line-height:1.4; }
  .frame { position:relative; width:360px; background:#04060c; border:1px solid #2b3646; border-radius:6px; overflow:hidden; margin-top:8px; }
  .cap { color:#7d8a9a; font-size:11px; text-align:left; margin:10px 0 -4px 2px; }
  svg { display:block; }
  text { font-family: Inter, system-ui, sans-serif; }
  .tip { display:inline-block; text-align:left; margin-top:8px; background:#121821; border:1px solid #2b3646; border-radius:5px; padding:6px 9px; min-width:200px; }
  .tip b { display:block; color:#e3eaf2; font-weight:500; font-size:12px; } .tip span { color:#7d8a9a; font-size:11px; }
</style></head><body>
<div class="row" id="row"></div>
<script>
const DIM = "#7d8a9a", ORBIT = "#2b3646", GLASS = "#cfe3ff", STAR = "#fffaf0", TONES = ["#3a4556", "#58667b", "#7e8da3"];
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  parent?.appendChild(n);
  return n;
};
const MOUTHS = [
  { star: "Senara", bearing: 287.01, open: true },
  { star: "Elowen", bearing: 198.58, open: true },
  { star: "Petroc", bearing: 287.84, open: false },
];

// --- how each option draws a closed mouth ----------------------------------------------------
const CHEV = "M-5,-6 L3,0 L-5,6 M-1,-6 L7,0 L-1,6";
const OPTIONS = [
  {
    title: "A · Dashed, like a closed room",
    note: "The chevrons dashed in Dim, as a closed room's outline is dashed. Its name is followed by “· closed” in Dim. The off-view marker is dashed too.",
    mouth(g, x, y, deg) {
      el("path", { d: CHEV, fill: "none", stroke: DIM, "stroke-width": 1.4, "stroke-dasharray": "2.2 1.8", transform: `translate(${x} ${y}) rotate(${-deg})` }, g);
    },
    name: (m) => (m.open ? m.star : `${m.star} · closed`),
    marker(g, x, y, deg, open) {
      el("path", { d: "M-4,-5 L3,0 L-4,5", fill: "none", stroke: DIM, "stroke-width": 1.3, ...(open ? {} : { "stroke-dasharray": "2 1.6", opacity: 0.8 }), transform: `translate(${x} ${y}) rotate(${deg})` }, g);
    },
  },
  {
    title: "B · Barred",
    note: "The chevrons in a dim Tone with a bar across their mouth, like a shut gate: no way in. “closed” on a second, smaller line under the name.",
    mouth(g, x, y, deg) {
      const t = `translate(${x} ${y}) rotate(${-deg})`;
      el("path", { d: CHEV, fill: "none", stroke: TONES[1], "stroke-width": 1.4, transform: t }, g);
      el("line", { x1: -8, y1: -7.5, x2: -8, y2: 7.5, stroke: DIM, "stroke-width": 1.6, transform: t }, g);
    },
    name: (m) => (m.open ? m.star : [m.star, "closed"]),
    marker(g, x, y, deg, open) {
      const t = `translate(${x} ${y}) rotate(${deg})`;
      el("path", { d: "M-4,-5 L3,0 L-4,5", fill: "none", stroke: open ? DIM : TONES[1], "stroke-width": 1.3, transform: t }, g);
      if (!open) el("line", { x1: -6.5, y1: -5.5, x2: -6.5, y2: 5.5, stroke: DIM, "stroke-width": 1.3, transform: t }, g);
    },
  },
  {
    title: "C · Faded",
    note: "The same chevrons, faded to .35, so the open lanes stand out and the closed one recedes. Its name at .6 with “(closed)”.",
    mouth(g, x, y, deg) {
      el("path", { d: CHEV, fill: "none", stroke: GLASS, "stroke-width": 1.4, opacity: 0.35, transform: `translate(${x} ${y}) rotate(${-deg})` }, g);
    },
    name: (m) => (m.open ? m.star : `${m.star} (closed)`),
    nameOpacity: 0.6,
    marker(g, x, y, deg, open) {
      el("path", { d: "M-4,-5 L3,0 L-4,5", fill: "none", stroke: DIM, "stroke-width": 1.3, opacity: open ? 1 : 0.45, transform: `translate(${x} ${y}) rotate(${deg})` }, g);
    },
  },
];

function openMouth(g, x, y, deg) {
  el("path", { d: CHEV, fill: "none", stroke: GLASS, "stroke-width": 1.4, transform: `translate(${x} ${y}) rotate(${-deg})` }, g);
}

function stars(svg, w, h, seed) {
  let s = seed;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 70; i++) el("circle", { cx: rnd() * w, cy: rnd() * h, r: rnd() < 0.15 ? 0.9 : 0.5, fill: "#cfd8e6", opacity: 0.25 + rnd() * 0.5 }, svg);
}

// the whole system, the edge's crowded corner the point of it
function whole(opt, vb = null) {
  const W = 360, H = 360, cx = 180, cy = 170, R = 150; // R px = 15,000 km
  const svg = el("svg", { width: W, height: vb ? 150 : H, viewBox: vb ?? `0 0 ${W} ${H}` });
  stars(svg, W, H, 7);
  el("circle", { cx, cy, r: R, fill: "none", stroke: ORBIT, "stroke-dasharray": "1 5" }, svg);
  el("circle", { cx, cy, r: 50, fill: "none", stroke: ORBIT }, svg); // Wenna's orbit
  const wx = cx + 50 * Math.cos((-60 * Math.PI) / 180), wy = cy + 50 * Math.sin((-60 * Math.PI) / 180);
  el("circle", { cx, cy, r: 13, fill: "#fff5d8", opacity: 0.18 }, svg);
  el("circle", { cx, cy, r: 5, fill: STAR }, svg);
  el("text", { x: cx, y: cy + 20, "font-size": 10, fill: DIM, "text-anchor": "middle" }, svg, "Maelor");
  el("circle", { cx: wx, cy: wy, r: 3.5, fill: TONES[2] }, svg);
  el("text", { x: wx, y: wy + 14, "font-size": 10, fill: DIM, "text-anchor": "middle" }, svg, "Wenna");

  // mouths, spread along the edge to 14 px apart; a crowd's names stacked inside the edge
  const ms = MOUTHS.map((m) => ({ ...m, a: m.bearing })).sort((p, q) => p.a - q.a);
  const minDeg = (18 / R) * (180 / Math.PI);
  const groups = [];
  for (const m of ms) {
    const last = groups.at(-1);
    if (last && m.a - last.at(-1).a < minDeg) last.push(m);
    else groups.push([m]);
  }
  for (const grp of groups) {
    const mid = grp.reduce((s, m) => s + m.a, 0) / grp.length;
    grp.forEach((m, i) => {
      const a = mid + (i - (grp.length - 1) / 2) * minDeg;
      const rad = (a * Math.PI) / 180;
      const x = cx + R * Math.cos(rad), y = cy - R * Math.sin(rad);
      const g = el("g", {}, svg);
      if (m.open) openMouth(g, x, y, a);
      else opt.mouth(g, x, y, a);
    });
    const rad = (mid * Math.PI) / 180;
    const ux = Math.cos(rad), uy = -Math.sin(rad);
    let lx = cx + (R - 16) * ux, ly = cy + (R - 16) * uy;
    const anchor = Math.abs(ux) < 0.35 ? "middle" : ux > 0 ? "end" : "start";
    const lines = grp.flatMap((m) => {
      const n = opt.name(m);
      return (Array.isArray(n) ? n.map((t, j) => ({ t, small: j > 0, m })) : [{ t: n, m }]);
    });
    if (uy > 0) ly -= (lines.length - 1) * 12; // below centre: stack upward, away from the edge
    lines.forEach((ln, i) => {
      const closed = !ln.m.open;
      el("text", { x: lx, y: ly + i * 12 + 3, "font-size": ln.small ? 9 : 10, fill: DIM, "text-anchor": anchor, opacity: closed && opt.nameOpacity ? opt.nameOpacity : 1 }, svg, ln.t);
    });
  }
  return svg;
}

// docked at Wenna Halt: the bottom of the band, with the off-view markers
function offView(opt) {
  const W = 360, H = 120;
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  stars(svg, W, H, 3);
  el("path", { d: `M-20,${H + 30} Q180,${H - 70} 380,${H + 30}`, fill: "none", stroke: ORBIT }, svg); // Wenna's orbit, far out
  const mk = (x, y, deg, rows) => {
    const g = el("g", {}, svg);
    opt.marker(g, x, y, deg, rows.every((r) => r.open));
    const ax = Math.cos((deg * Math.PI) / 180), ay = Math.sin((deg * Math.PI) / 180);
    const anchor = ax > 0.3 ? "end" : ax < -0.3 ? "start" : "middle";
    const x0 = x - ax * 10, y0 = y - ay * 10 + 3 - (rows.length - 1) * 11;
    rows.forEach((r, i) => {
      const faded = !r.open && opt.nameOpacity;
      el("text", { x: x0, y: y0 + i * 11, "font-size": 9, fill: DIM, "text-anchor": anchor, opacity: faded ? opt.nameOpacity : 1 }, g, r.t);
    });
  };
  const nm = (m) => { const n = opt.name(m); return Array.isArray(n) ? `${n[0]} · ${n[1]}` : n; };
  mk(54, H - 14, 112, [{ t: `${nm(MOUTHS[1])} 15k`, open: true }]);
  // Senara and Petroc land on the same spot: one chevron, a line each
  const stack = [MOUTHS[0], MOUTHS[2]].map((m) => ({ t: `${nm(m)} 15.8k`, open: m.open }));
  const g = el("g", {}, svg);
  // the merged chevron: solid (one of them is open), the closed one's own mark beside its line
  el("path", { d: "M-4,-5 L3,0 L-4,5", fill: "none", stroke: DIM, "stroke-width": 1.3, transform: `translate(232 ${H - 14}) rotate(76)` }, g);
  const x0 = 232, y0 = H - 24 + 3 - 11;
  stack.forEach((r, i) => {
    const faded = !r.open && opt.nameOpacity;
    el("text", { x: x0, y: y0 + i * 11, "font-size": 9, fill: DIM, "text-anchor": "middle", opacity: faded ? opt.nameOpacity : 1 }, g, r.t);
  });
  // and a lone closed marker, as it'd look with no open mouth beside it
  mk(330, 50, 0, [{ t: `${nm(MOUTHS[2])} 15.8k`, open: false }]);
  el("text", { x: 340, y: 66, "font-size": 8, fill: ORBIT, "text-anchor": "end" }, svg, "(alone, for comparison)");
  return svg;
}

const row = document.getElementById("row");
for (const opt of OPTIONS) {
  const fig = document.createElement("figure");
  const cap1 = document.createElement("div"); cap1.className = "cap"; cap1.textContent = "Whole system: Senara and Petroc 0.8° apart, Elowen alone";
  const f1 = document.createElement("div"); f1.className = "frame"; f1.appendChild(whole(opt));
  const capz = document.createElement("div"); capz.className = "cap"; capz.textContent = "The same corner, 3× (pixels magnified, not zoomed)";
  const fz = document.createElement("div"); fz.className = "frame"; fz.appendChild(whole(opt, "180 268 120 50"));
  const cap2 = document.createElement("div"); cap2.className = "cap"; cap2.textContent = "Docked at Wenna Halt: off-view markers along the bottom";
  const f2 = document.createElement("div"); f2.className = "frame"; f2.appendChild(offView(opt));
  const tip = document.createElement("div"); tip.className = "tip";
  tip.innerHTML = "<b>the Petroc lane mouth</b><span>closed</span>";
  const fc = document.createElement("figcaption");
  fc.innerHTML = `${opt.title}<small>${opt.note}</small>`;
  fig.append(fc, cap1, f1, capz, fz, cap2, f2, tip);
  row.appendChild(fig);
}
</script>
</body></html>
