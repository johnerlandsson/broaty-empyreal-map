<!doctype html>
<!-- Bins behind a ladderway hatch, 2026-10-30: the cleaners' docks' bins are in the ladderways, not the
     corridor stops, and a can on the corridor beside the hatch reads as the stop's own: Mid 9:00 has no
     bin, Ladderway 9, Mid has. Three ways to tie the can to the hatch. Real plans from ui/ with the
     synced data; only the corridor marks and hatch outlines are redrawn for each option. Each frame is
     the panel's bottom band at its default size, 380 x 300. Serve the repo root over http to open it.
     A throwaway: take its look, not its code. Picked: B (2026-10-30). -->
<html><head><meta charset="utf-8"><title>Bins behind a hatch: options</title>
<style>
  body { margin:0; background:#04060c; color:#7d8a9a; font:13px Inter, system-ui, sans-serif; padding:14px 18px; width:max-content; }
  h2 { color:#e3eaf2; font-size:15px; margin:14px 0 2px; }
  h2 small { color:#7d8a9a; font-weight:400; font-size:12px; margin-left:8px; }
  .row { display:flex; gap:10px; margin:6px 0 2px; }
  figure { margin:0; text-align:center; }
  figcaption { font:11px "DejaVu Sans Mono", monospace; margin-top:3px; }
  .f { position:relative; width:380px; height:300px; background:#04060c; border-radius:6px; overflow:hidden; outline:1px solid #18202b; }
  .f .m { position:absolute; inset:0; }
  .f .m button { display:none; }
  .zoom { position:absolute; left:8px; top:6px; font:10px "DejaVu Sans Mono", monospace; color:#7d8a9a; }
</style></head><body>
<div id="out"></div>
<script type="module">
import { DeckView, binMark } from "../../../ui/deck-view.js";
import { indexStation, locate } from "../../../ui/lib/locate.js";
import { tissRooms } from "../../../ui/lib/look.js";
import { data } from "../../../ui/data/places.js";

const LADDER = "#9fb0c3", DIM = "#7d8a9a";
const NS = "http://www.w3.org/2000/svg";
const add = (lap, tag, attrs) => {
  const e = lap.appendChild(document.createElementNS(NS, tag));
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};
const OPTIONS = [
  { key: "A", title: "A · Hatch's colour, touching it", sub: "the can sits right against the hatch and is drawn in the hatch's brighter line; a room's own cans stay dim",
    dock: (lap, cx) => { binMark(lap, cx + 42, 0); const m = lap.lastChild; m.setAttribute("stroke", LADDER); m.setAttribute("stroke-width", 1.2 / +m.getAttribute("transform").match(/scale\((\S+)\)/)[1] * 1.3); } },
  { key: "B", title: "B · Inside a wider hatch", sub: "the hatch's outline stretches to hold the ladder and the can: this box is the ladderway, and the bin is in it",
    dock: (lap, cx) => { lap.querySelectorAll("rect").forEach((r) => { if (+r.getAttribute("x") === cx + 20 && r.getAttribute("width") === "14") r.setAttribute("width", "31"); }); binMark(lap, cx + 43, 0); } },
  { key: "C", title: "C · Tag on the hatch", sub: "a small can hung off the hatch's corner, half overlapping it, like a badge on the ladderway",
    dock: (lap, cx) => { binMark(lap, cx + 37, -8); const m = lap.lastChild; m.setAttribute("transform", m.getAttribute("transform").replace(/scale\((\S+)\)/, (_, k) => `scale(${k * 0.72})`)); m.setAttribute("stroke", LADDER); add(lap, "circle", { cx: cx + 37, cy: -8, r: 6.5, fill: "#0e131a", stroke: LADDER, "stroke-width": 1 }); lap.appendChild(m); } },
];

const W = 380, H = 300, ASPECT = H / W;
const tiss = data.tiss;
const index = indexStation(tissRooms(tiss));

function frame(row, cap, make, note) {
  const fig = row.appendChild(document.createElement("figure"));
  const f = fig.appendChild(document.createElement("div"));
  f.className = "f";
  const m = f.appendChild(document.createElement("div"));
  m.className = "m";
  if (note) f.appendChild(Object.assign(document.createElement("div"), { className: "zoom", textContent: note }));
  fig.appendChild(Object.assign(document.createElement("figcaption"), { textContent: cap }));
  return make(m);
}

function ring(m, level, roomId, hour, width, opt) {
  const deck = new DeckView(m, index, undefined, { pick: true });
  deck.set(locate(index, { roomId }));
  const plan = deck.plans[level];
  const stop = plan.layout.stops.find((s) => s.hour === hour);
  deck.setView([stop.cx - width / 2, -width * ASPECT / 2, width, width * ASPECT]);
  if (opt) {
    const docks = { 0: [0, 6], 1: [9], 2: [3] }[level];
    for (const lap of plan.g.querySelectorAll("g[transform]")) {
      const onStop = [...lap.querySelectorAll("[data-bin]")].filter((b) => /translate\(\S+ -?\d+\)/.test(b.getAttribute("transform")) && Math.abs(+b.getAttribute("transform").match(/translate\(\S+ (\S+)\)/)[1]) < 15);
      if (!onStop.length) continue;
      onStop.forEach((b) => b.remove());
      for (const h of docks) {
        const cx = plan.layout.stops.find((s) => s.hour === h).cx;
        opt.dock(lap, cx);
        if (level === 0 && h === 0) binMark(lap, cx - 23, 0); // the Concourse's own, on the stop, the lift's other side
      }
    }
  }
  plan.g.appendChild(plan.hl);
}

const out = document.getElementById("out");
for (const opt of OPTIONS) {
  const h = out.appendChild(document.createElement("h2"));
  h.innerHTML = `${opt.title}<small>${opt.sub}</small>`;
  const row = out.appendChild(document.createElement("div"));
  row.className = "row";
  frame(row, "Mid 9:00, home zoom", (m) => ring(m, 1, "tiss.mid-0900", 9, 600, opt), "600 wide");
  frame(row, "Mid 9:00, zoomed in", (m) => ring(m, 1, "tiss.mid-0900", 9, 220, opt), "220 wide");
  frame(row, "Rim 12:00, both bins", (m) => ring(m, 0, "tiss.concourse", 0, 220, opt), "220 wide");
}
document.body.dataset.ready = "1";
</script>
</body></html>
