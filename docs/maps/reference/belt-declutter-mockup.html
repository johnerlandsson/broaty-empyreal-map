<!doctype html>
<!-- The belt map, crowded, 2026-10-25: a skiff at the Cinders with a dozen sweeps logged, the Magpie on
     the last sweep, alongside her host, and the bearing ring's marks. Now, and three ways to quieten it. Picked: B. -->
<html><head><meta charset="utf-8"><style>
body{background:#11151c;color:#dfe7f1;font-family:Inter,system-ui,sans-serif;margin:16px}
.row{display:flex;gap:18px;flex-wrap:wrap;width:1100px}
.opt{width:530px;margin-bottom:10px}
h2{font-size:14px;margin:0 0 6px}
p{font-size:12px;color:#9fb0c3;margin:6px 0 0;line-height:1.4}
.band{width:530px;height:380px;background:#04060c;border:1px solid #2b3646}
</style></head><body><div class="row" id="row"></div>
<script>
const HL="#ffb347",HLS="#fff3df",DIM="#7d8a9a",ORBIT="#2b3646",STAR="#fffaf0",GLASS="#cfe3ff",TEXT="#e3eaf2",GREEN="#59d18a",BG="#04060c",NAMED="#c3ccd8",TONES=["#3a4556","#58667b","#7e8da3"];
const W=530,H=380,R=16,cx=W/2,cy=H/2,rr=Math.min(W,H)/2-24,k=rr/R;
// sweeps oldest first, as the log keeps them
const SW=[[-9.5,-4],[-8.2,-5.6],[-10.6,-6.3],[-7.4,-3.1],[-9.1,-7.2],[-6.8,-6],[-8.8,-2.4],[-10.2,-4.8],[1.4,9.9],[2.6,7.6],[3.6,5.8],[3.9,1]];
const TRACK=[[[-12.2,-4.9],[-7.8,-3.9],[-9.6,-6.7],[-7.2,-5.3],[-9.5,-2.6]],[[-7,4.6],[1.6,6],[3.9,1]]];
const ME=[3.9,0.2],MAG=[-1.9,3.2];
const PINS=[{k:"mouth",n:"Maelor",d:342},{k:"station",n:"Orrin Station",d:28},{k:"station",n:"T.I.S.S. · home",d:96},{k:"planet",n:"Tamsin",d:128},{k:"port",n:"Zennor",d:150},{k:"mouth",n:"Keyne",d:206},{k:"star",n:"Senara",d:252}];
const P=([x,y])=>[cx+x*k,cy-y*k];
const at=(r,d)=>[cx+Math.sin(d*Math.PI/180)*r,cy-Math.cos(d*Math.PI/180)*r];
const halo=`stroke="${BG}" stroke-width="3" stroke-linejoin="round" paint-order="stroke"`;
function stars(n,seed){let s=seed,o="";const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<n;i++)o+=`<circle cx="${r()*W}" cy="${r()*H}" r="${0.4+r()*0.6}" fill="#fff" opacity="${0.12+r()*0.5}"/>`;return o}
const T=(x,y,s,a="")=>`<text x="${x}" y="${y}" font-size="8.5" fill="${DIM}" ${halo} ${a}>${s}</text>`;
function defs(id){return `<defs><filter id="g${id}" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="edge${id}"><feMorphology in="SourceAlpha" operator="dilate" radius="1" result="d"/><feComposite in="d" in2="SourceAlpha" operator="out" result="e"/><feFlood flood-color="${GREEN}" flood-opacity=".35"/><feComposite in2="e" operator="in"/></filter></defs>`}
function disc(skipCard){let o="";o+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="${TONES[1]}" stroke-width="1.2"/>`;
 for(const km of[5,10,15])o+=`<circle cx="${cx}" cy="${cy}" r="${km*k}" fill="none" stroke="${ORBIT}" stroke-dasharray="1 4"/><text x="${cx+3}" y="${cy-km*k+10}" font-size="8" fill="${DIM}" opacity=".8">${km===5?"5 km":km}</text>`;
 for(let d=0;d<360;d+=10){const L=d%30===0?5:2.5,a=at(rr,d),b=at(rr+L,d);o+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${d%30===0?TONES[2]:TONES[0]}"/>`}
 for(const d of[0,90,180,270]){if(PINS.some(p=>Math.abs(((p.d-d+540)%360)-180)<7))continue;const p=at(rr+13,d);o+=`<text x="${p[0]}" y="${p[1]+3}" font-size="8" fill="${DIM}" text-anchor="middle">${d}°</text>`}
 return o+`<path d="M${cx-4},${cy}H${cx+4}M${cx},${cy-4}V${cy+4}" stroke="${STAR}" stroke-width="1.2"/>`}
function pins(quiet){let o="";for(const m of PINS){const[x,y]=at(rr+12,m.d);
 if(m.k==="star")o+=`<circle cx="${x}" cy="${y}" r="6" fill="${STAR}" opacity=".18"/><circle cx="${x}" cy="${y}" r="2.4" fill="${STAR}"/>`;
 else if(m.k==="planet")o+=`<circle cx="${x}" cy="${y}" r="3.2" fill="${TONES[0]}" stroke="${TONES[2]}" stroke-width=".8"/>`;
 else if(m.k==="port")o+=`<path d="M${x-3},${y+1.2}A3,3 0 0 1 ${x+3},${y+1.2}Z" fill="none" stroke="${GLASS}" stroke-width="1.1"/>`;
 else if(m.k==="mouth")o+=`<path d="M-3,1.5L0,-1.5L3,1.5M-3,4.5L0,1.5L3,4.5" fill="none" stroke="${GLASS}" stroke-width="1.1" transform="translate(${x} ${y}) rotate(${m.d})"/>`;
 else o+=`<path d="M${x},${y-3.5}L${x+2.6},${y}L${x},${y+3.5}L${x-2.6},${y}Z" fill="none" stroke="${GLASS}" stroke-width="1.1"/>`;
 const right=Math.sin(m.d*Math.PI/180)>=0;o+=T(right?x+7:x-7,y+3,m.n,`text-anchor="${right?"start":"end"}" ${quiet?'font-size="8" opacity=".75"':""}`)}return o}
// sweeps: "stack" each its own .08 wash and .3 rim; "wash" one wash and one rim round all of them; "fade" older ones fainter
function sweeps(mode,id){let o="";
 if(mode==="stack")SW.forEach(s=>{const[x,y]=P(s);o+=`<circle cx="${x}" cy="${y}" r="${5*k}" fill="${GREEN}" fill-opacity=".08" stroke="${GREEN}" stroke-opacity=".3"/>`});
 if(mode==="wash"){const c=SW.map(s=>{const[x,y]=P(s);return `<circle cx="${x}" cy="${y}" r="${5*k}"/>`}).join("");
  o+=`<g fill="${GREEN}" opacity=".09">${c}</g><g fill="#000" filter="url(#edge${id})">${c}</g>`}
 if(mode==="fade")SW.forEach((s,i)=>{const[x,y]=P(s),a=(i+1)/SW.length,last=i>=SW.length-3;o+=`<circle cx="${x}" cy="${y}" r="${5*k}" fill="${GREEN}" fill-opacity="${last?.08:.025}" stroke="${GREEN}" stroke-opacity="${last?.3:.06+.12*a}"/>`});
 return o}
function track(fade){return TRACK.map((seg,i)=>`<polyline points="${seg.map(P).map(p=>p.join(",")).join(" ")}" fill="none" stroke="${HL}" stroke-opacity="${fade&&i<TRACK.length-1?.15:.3}" stroke-width="2" stroke-linejoin="round"/>`).join("")}
function br(x,y,s=5,a=2.6){return `M${x-s},${y-s+a}V${y-s}H${x-s+a}M${x+s-a},${y-s}H${x+s}V${y-s+a}M${x+s},${y+s-a}V${y+s}H${x+s-a}M${x-s+a},${y+s}H${x-s}V${y+s-a}`}
function ships(oneLine){let o="";const[mx,my]=P(MAG);o+=`<path d="${br(mx,my)}" fill="none" stroke="${GLASS}" stroke-width="1.2"/><circle cx="${mx}" cy="${my}" r="1.3" fill="${GLASS}"/>`;
 o+=`<text x="${mx+10}" y="${my+1}" font-size="8.5" fill="${NAMED}" ${halo}>the Magpie · 14.5 km, 277°</text>`;
 o+=oneLine?"":`<text x="${mx+10}" y="${my+11}" font-size="8" fill="${DIM}" opacity=".75" ${halo}>skiff · seen 10m ago</text>`;
 const[hx,hy]=P([ME[0],ME[1]+0.5]);o+=`<circle cx="${hx}" cy="${hy}" r="${5*k}" fill="none" stroke="${GLASS}" stroke-opacity=".45" stroke-dasharray="3 3"/><path d="${br(hx,hy)}" fill="none" stroke="${GLASS}" stroke-width="1.2"/><circle cx="${hx}" cy="${hy}" r="1.3" fill="${GLASS}"/>`;
 o+=`<text x="${hx+10}" y="${hy-3}" font-size="8.5" fill="${NAMED}" ${halo}>the Old Reliable · here</text>`;
 o+=oneLine?"":`<text x="${hx+10}" y="${hy+7}" font-size="8" fill="${DIM}" opacity=".75" ${halo}>freighter · seen 10m ago</text>`;
 if(oneLine)o+=`<text x="${W-10}" y="${H-10}" font-size="8" fill="${DIM}" text-anchor="end" opacity=".75">ships as the sweep saw them 10m ago</text>`;
 return o}
function me(id){const[x,y]=P(ME);return `<circle cx="${x}" cy="${y}" r="${5*k}" fill="none" stroke="${GREEN}" stroke-opacity=".5" stroke-dasharray="4 3"/><g filter="url(#g${id})"><path d="M0,-8 L5,6 L0,3 L-5,6 Z" transform="translate(${x} ${y})" fill="${HL}" stroke="${HLS}" stroke-width=".8"/></g>`}
const words=`<text x="12" y="20" font-size="9.5" fill="${TEXT}" letter-spacing="1" ${halo}>THE CINDERS</text><text x="12" y="33" font-size="10" fill="${TEXT}" ${halo}>4 km out from the core,</text><text x="12" y="45" font-size="10" fill="${TEXT}" ${halo}>bearing 90°</text>`;
const opts=[
 ["Now (with the double host fixed)",id=>defs(id)+stars(90,7)+disc()+sweeps("stack",id)+track()+ships()+me(id)+pins()+words,"As built: every sweep its own green wash and rim, so a dozen in one place stack up to a bright blob with a tangle of rims."],
 ["A · one wash for the swept ground",id=>defs(id)+stars(90,7)+disc()+sweeps("wash",id)+track()+ships()+me(id)+pins()+words,"All the sweeps drawn as one shape: the ground you've swept, the same faint green wherever it is, with one rim round its outside. You lose seeing where sweeps overlap; you keep where you've been."],
 ["B · older sweeps fade",id=>defs(id)+stars(90,7)+disc()+sweeps("fade",id)+track(true)+ships()+me(id)+pins()+words,"The last three sweeps as now; older ones nearly gone, and older visits' track at half. What you did lately stands out; the log is still there if you look."],
 ["C · A, and fewer words",id=>defs(id)+stars(90,7)+disc()+sweeps("wash",id)+track()+ships(true)+me(id)+pins(true)+words,"A's one wash, ships named on one line (the hull and age go; one corner note says how old the sweep is), and the ring's names a size smaller at .75."],
];
const row=document.getElementById("row");
opts.forEach(([t,fn,d],i)=>{const div=document.createElement("div");div.className="opt";div.innerHTML=`<h2>${t}</h2><div class="band"><svg width="${W}" height="${H}" font-family="Inter,system-ui,sans-serif">${fn(i)}</svg></div><p>${d}</p>`;row.appendChild(div)});
</script></body></html>
