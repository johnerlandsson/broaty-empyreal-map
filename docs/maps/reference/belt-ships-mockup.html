<!doctype html>
<!-- Ships on the belt map, 2026-10-25: three ways to draw the last sweep's ships on the belt's disc
     (navigation.md decision 18: a contact is her place at the sweep plus its km and bearing), the
     host seen again since you left her, and the pair while she's docked at her host in a belt.
     Picked: A (the chart's brackets), 2026-10-25. -->
<html><head><meta charset="utf-8"><style>
body{background:#11151c;color:#dfe7f1;font-family:Inter,system-ui,sans-serif;margin:16px;width:1340px}
.row{display:flex;gap:18px;margin-bottom:14px}
.opt{width:430px}
h2{font-size:14px;margin:0 0 6px}
h3{font-size:11px;margin:8px 0 4px;color:#9fb0c3;font-weight:500}
p{font-size:12px;color:#9fb0c3;margin:6px 0 0;line-height:1.4}
.band{width:430px;height:280px;background:#04060c;position:relative;border:1px solid #2b3646}
</style></head><body><div class="row" id="row"></div>
<script>
const HL="#ffb347",HLS="#fff3df",DIM="#7d8a9a",ORBIT="#2b3646",STAR="#fffaf0",GLASS="#cfe3ff",TEXT="#e3eaf2",GREEN="#59d18a",BG="#04060c",TONES=["#3a4556","#58667b","#7e8da3"];
const R=18,W=430,H=280,cx=W/2,cy=H/2,k=(Math.min(W,H)/2-24)/R;
const f=([x,y])=>[cx+x*k,cy-y*k];
const halo=`stroke="${BG}" stroke-width="3" stroke-linejoin="round" paint-order="stroke"`;
const T=(x,y,s,a="")=>`<text x="${x}" y="${y}" font-size="8.5" fill="${DIM}" ${halo} ${a}>${s}</text>`;
function stars(n,seed){let s=seed,o="";const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<n;i++)o+=`<circle cx="${r()*W}" cy="${r()*H}" r="${0.4+r()*0.6}" fill="#fff" opacity="${0.12+r()*0.5}"/>`;return o}
const defs=`<defs><filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
function chev(p,deg,s=1){return `<g filter="url(#g)"><path d="M0,-8 L5,6 L0,3 L-5,6 Z" transform="translate(${p[0]} ${p[1]}) rotate(${deg}) scale(${s})" fill="${HL}" stroke="${HLS}" stroke-width=".8" stroke-linejoin="round"/></g>`}
const rb=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1];return [Math.hypot(dx,dy),((Math.atan2(dx,dy)*180/Math.PI)+360)%360]};
const fmt=(a,b)=>{const [km,br]=rb(a,b);return `${km.toFixed(1)} km, ${Math.round(br)}°`};
// the disc as built
function disc(seed){let o=defs+stars(80,seed);
o+=`<circle cx="${cx}" cy="${cy}" r="${R*k}" fill="none" stroke="${TONES[1]}" stroke-width="1.2"/>`;
for(const km of [5,10,15]){o+=`<circle cx="${cx}" cy="${cy}" r="${km*k}" fill="none" stroke="${ORBIT}" stroke-dasharray="1 4"/><text x="${cx+3}" y="${cy-km*k+10}" font-size="8" fill="${DIM}" opacity=".8">${km===5?"5 km":km}</text>`}
for(let d=0;d<360;d+=10){const a=d*Math.PI/180,L=d%30===0?5:2.5,r=R*k;o+=`<line x1="${cx+Math.sin(a)*r}" y1="${cy-Math.cos(a)*r}" x2="${cx+Math.sin(a)*(r+L)}" y2="${cy-Math.cos(a)*(r+L)}" stroke="${d%30===0?TONES[2]:TONES[0]}"/>`}
for(const d of [0,90,180,270]){const a=d*Math.PI/180,r=R*k+13;o+=`<text x="${cx+Math.sin(a)*r}" y="${cy-Math.cos(a)*r+3}" font-size="8" fill="${DIM}" text-anchor="middle">${d}°</text>`}
o+=`<path d="M${cx-4},${cy}H${cx+4}M${cx},${cy-4}V${cy+4}" stroke="${STAR}" stroke-width="1.2"/>`;return o}
function head(lines){return `<text x="12" y="20" font-size="9.5" fill="${TEXT}" letter-spacing="1" ${halo}>GANNET BELT</text>`+lines.map((s,i)=>`<text x="12" y="${33+i*12}" font-size="10" fill="${TEXT}" ${halo}>${s}</text>`).join("")}
function card(s){return `<rect x="${W-118}" y="${H-26}" width="110" height="18" rx="4" fill="${BG}" fill-opacity=".85" stroke="${ORBIT}"/><text x="${W-112}" y="${H-14}" font-size="9" fill="${DIM}">${s}</text>`}
function sweepDisc(p){const q=f(p);return `<circle cx="${q[0]}" cy="${q[1]}" r="${5*k}" fill="${GREEN}" fill-opacity=".08" stroke="${GREEN}" stroke-opacity=".3"/>`}
function left(p,lines,dim=1){const [x,y]=f(p);return `<g opacity="${dim}"><circle cx="${x}" cy="${y}" r="${5*k}" fill="none" stroke="${GLASS}" stroke-opacity=".45" stroke-dasharray="3 3"/><path d="M${x},${y-4}L${x+3},${y}L${x},${y+4}L${x-3},${y}Z" fill="none" stroke="${GLASS}" stroke-width="1.1"/>${T(x+8,y-6,lines[0])}${T(x+8,y+4,lines[1],'font-size="8" opacity=".75"')}</g>`}
const track=(ps)=>`<polyline points="${ps.map(f).map(p=>p.join(",")).join(" ")}" fill="none" stroke="${HL}" stroke-opacity=".3" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
const brackets=(x,y,r,l)=>`M${x-r},${y-r+l}V${y-r}H${x-r+l}M${x+r-l},${y-r}H${x+r}V${y-r+l}M${x+r},${y+r-l}V${y+r}H${x+r-l}M${x-r+l},${y+r}H${x-r}V${y+r-l}`;

// scene 1: a skiff 4m after a sweep; she's moved on since. Her host, left 14m ago, seen again.
const LEFT=[7.2,5.1], SWP=[-1.5,-3.5], NOW=[-5.5,-9.5];
const FM={name:"Full Measure",line:"freighter",p:[9.4,1.6]};
const C1={name:"contact-1",p:[-12.5,3.2],dark:true};
const MULE={name:"Mule",line:"skiff · under drive",p:[2.5,-13.4],moving:true};
const SEEN=[FM,C1,MULE];
// scene 2: docked at her host in the belt
const HOST=[4.2,-7.6];
const MULE2={name:"Mule",line:"skiff",p:[-6.8,2.4]};
const now1=head(["14 km out from the core,","bearing 210°"]);
const now2=head(["docked at the Full Measure,","8.7 km out from the core, bearing 151°"]);

// A: the chart's brackets
function shipA(c,from,age,extra=""){const [x,y]=f(c.p);const col=c.dark?DIM:GLASS;let o=`<path d="${brackets(x,y,5,2.6)}" fill="none" stroke="${col}" stroke-width="1.2"/>`;
if(!c.dark)o+=`<circle cx="${x}" cy="${y}" r="1.3" fill="${GLASS}"/>`;
if(c.moving)o+=`<path d="M${x-8},${y}H${x-6}M${x+6},${y}H${x+8}" stroke="${col}"/>`;
o+=`<text x="${x+10}" y="${y+1}" font-size="8.5" fill="${c.dark?DIM:"#aebccc"}" ${halo}>${c.name} · ${fmt(from,c.p)}</text>`;
o+=T(x+10,y+11,[c.line,extra||age].filter(Boolean).join(" · "),'font-size="8" opacity=".75"');return o}
function A1(){let o=disc(7)+sweepDisc(SWP)+left(LEFT,["where you left the Full Measure","last seen 14m ago"],.55)+track([LEFT,[3,-1],SWP,NOW]);
const a=f(LEFT),b=f(FM.p);o+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${GLASS}" stroke-opacity=".35" stroke-dasharray="1 3"/>`;
for(const c of SEEN)o+=shipA(c,NOW,"seen 4m ago");
o+=chev(f(NOW),205)+now1+card("Last sweep · 4m ago");return o}
function A2(){let o=disc(7)+head([]);const [x,y]=f(HOST);
o+=`<path d="${brackets(x,y,7,3)}" fill="none" stroke="${GLASS}" stroke-width="1.2"/>`;
o+=chev([x,y],0,.8);
o+=`<text x="${x+12}" y="${y+1}" font-size="8.5" fill="#aebccc" ${halo}>Full Measure</text>`+T(x+12,y+11,"freighter · docked",'font-size="8" opacity=".75"');
o+=shipA(MULE2,HOST,"seen 2m ago")+now2+card("Last sweep · 2m ago");return o}

// B: hull glyphs, ghosted as seen
function hull(c,x,y,s=1){if(c.dark)return `<circle cx="${x}" cy="${y}" r="3.2" fill="none" stroke="${DIM}" stroke-dasharray="1.6 1.4"/>`;
if(c.line.startsWith("freighter"))return `<rect x="${x-6*s}" y="${y-3.2*s}" width="${12*s}" height="${6.4*s}" rx="${2.4*s}" fill="${GLASS}" fill-opacity=".14" stroke="${GLASS}" stroke-width="1.1"/>`;
return `<path d="M${x},${y-4} L${x+3},${y+3} L${x-3},${y+3}Z" fill="${GLASS}" fill-opacity=".14" stroke="${GLASS}" stroke-width="1.1"/>`}
function shipB(c,from,age){const [x,y]=f(c.p);let o=hull(c,x,y);
if(c.moving)o+=`<path d="M${x},${y+5}V${y+9}" stroke="${GLASS}" stroke-opacity=".6"/>`;
o+=T(x+10,y-2,`${c.name}${c.line?" · "+c.line:""}`,`fill="${c.dark?DIM:"#aebccc"}"`);
o+=T(x+10,y+8,`${fmt(from,c.p)} · ${age}`,'font-size="8" opacity=".75"');return o}
function B1(){let o=disc(11)+sweepDisc(SWP)+left(LEFT,["where you left the Full Measure","last seen 14m ago"],.55)+track([LEFT,[3,-1],SWP,NOW]);
const a=f(LEFT),b=f(FM.p);o+=`<path d="M${a[0]},${a[1]}L${b[0]},${b[1]}" stroke="${GLASS}" stroke-opacity=".4" stroke-dasharray="2 3" marker-end=""/>`;
for(const c of SEEN)o+=shipB(c,NOW,"4m ago");
o+=chev(f(NOW),205)+now1+card("Last sweep · 4m ago");return o}
function B2(){let o=disc(11)+head([]);const [x,y]=f(HOST);
o+=hull({line:"freighter"},x,y,1.6);o+=chev([x+12,y],90,.75);
o+=T(x-14,y-10,"Full Measure · freighter",'text-anchor="end" fill="#aebccc"')+T(x-14,y,"you're at her collar",'text-anchor="end" font-size="8" opacity=".75"');
o+=shipB(MULE2,HOST,"2m ago")+now2+card("Last sweep · 2m ago");return o}

// C: a bearing line from her to each, the range and bearing on it
function shipC(c,from,age){const [x,y]=f(c.p),[hx,hy]=f(from);let o=`<line x1="${hx}" y1="${hy}" x2="${x}" y2="${y}" stroke="${c.dark?DIM:GLASS}" stroke-opacity=".28" stroke-dasharray="2 4"/>`;
const mx=(hx+x)/2,my=(hy+y)/2;o+=T(mx+4,my-3,fmt(from,c.p),`font-size="8" fill="${c.dark?DIM:GLASS}" opacity=".85"`);
o+=`<circle cx="${x}" cy="${y}" r="3.4" fill="${c.dark?"none":GLASS}" fill-opacity=".85" stroke="${c.dark?DIM:GLASS}" stroke-width="1.1"/>`;
o+=`<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="${c.dark?DIM:GLASS}" stroke-opacity=".3"/>`;
o+=T(x+10,y-2,c.name,`fill="${c.dark?DIM:"#aebccc"}"`)+T(x+10,y+8,[c.line,`seen ${age}`].filter(Boolean).join(" · "),'font-size="8" opacity=".75"');return o}
function C1f(){let o=disc(5)+sweepDisc(SWP)+left(LEFT,["where you left the Full Measure","last seen 14m ago"],.55)+track([LEFT,[3,-1],SWP,NOW]);
for(const c of SEEN)o+=shipC(c,NOW,"4m ago");
o+=chev(f(NOW),205)+now1+card("Last sweep · 4m ago");return o}
function C2f(){let o=disc(5)+head([]);const [x,y]=f(HOST);
o+=`<circle cx="${x}" cy="${y}" r="9" fill="${GLASS}" fill-opacity=".1" stroke="${GLASS}" stroke-width="1.1"/>`;o+=chev([x,y],0,.75);
o+=T(x+13,y-2,"Full Measure",'fill="#aebccc"')+T(x+13,y+8,"freighter · docked",'font-size="8" opacity=".75"');
o+=shipC(MULE2,HOST,"2m ago")+now2+card("Last sweep · 2m ago");return o}

const opts=[["A · The chart's brackets",A1,A2,"Each ship as the chart draws her: Glass brackets and a dot (dim and empty for a dark one, ticked under drive). Her name with range and bearing from you now; the hull and age under it. Your host, seen again since you left her, gets a dotted Glass line from where you left her to where the sweep saw her, and the old diamond dims. Docked: her chevron, small, inside the freighter's brackets."],
["B · Hull glyphs",B1,B2,"A small Glass silhouette by hull: a rounded bar for a freighter, a triangle for a skiff, a dashed ring for a dark one (no hull known). A tick behind one under drive. Name and hull above, range, bearing and age below. Docked: the freighter's bar drawn bigger with her chevron at its collar."],
["C · Bearing lines",C1f,C2f,"A Glass dot in a faint ring per ship, and a dashed line from you to each with \"4.2 km, 53°\" on it: the way to type rcs. Name and hull and age beside the dot. Busier with several ships. Docked: a Glass disc round her chevron."]];
const row=document.getElementById("row");
for(const [t,s1,s2,d] of opts){const o=document.createElement("div");o.className="opt";
o.innerHTML=`<h2>${t}</h2><h3>A skiff, 4 minutes after a sweep</h3><div class="band"><svg width="${W}" height="${H}">${s1()}</svg></div><h3>Docked at her freighter in the belt</h3><div class="band"><svg width="${W}" height="${H}">${s2()}</svg></div><p>${d}</p>`;row.appendChild(o)}
</script></body></html>
