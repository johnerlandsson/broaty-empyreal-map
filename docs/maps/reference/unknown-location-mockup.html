<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unknown location: options</title>
<!-- What the panel shows before the Lua side has said where you are (no station is built yet).
     Three options side by side at the panel's default size, 380 x 600. -->
<style>
  body { margin: 0; padding: 16px; background: #10151d; display: flex; gap: 20px; font-family: "DejaVu Sans Mono", monospace; }
  figure { margin: 0; }
  figcaption { color: #dfe7f1; font: 600 13px system-ui, sans-serif; margin-bottom: 8px; }
  figcaption span { display: block; font-weight: 400; font-size: 11px; color: #8a96a6; margin-top: 2px; max-width: 380px; }
  .panel { position: relative; width: 380px; height: 600px; display: grid; grid-template-rows: 42fr 1px 58fr; background: #04060c; }
  .band { position: relative; overflow: hidden; }
  .band svg { display: block; width: 100%; height: 100%; }
  .rule { background: #2b3646; }
  .info { position: absolute; left: 8px; bottom: 8px; padding: 2px 6px; border-radius: 4px; font-size: 11px; letter-spacing: .5px; color: #dfe7f1; background: #04060cb3; }
  .info .dim { color: #7d8a9a; }
</style>
</head>
<body>

<figure>
  <figcaption>A · Quiet sky<span>A sparse starfield (~150 stars, not 1,200) with a dashed ring and a "?" where a station would be; the plan band an empty dashed floor.</span></figcaption>
  <div class="panel">
    <div class="band"><svg id="a-top" viewBox="0 0 380 250"></svg></div>
    <div class="rule"></div>
    <div class="band"><svg id="a-deck" viewBox="0 0 380 349"></svg></div>
    <div class="info">LOCATION UNKNOWN</div>
  </div>
</figure>

<figure>
  <figcaption>B · A marker, waiting<span>No stars, nothing to draw: a map pin outlined in the dim grey with a "?" in it, and one line under it. The plan band stays bare.</span></figcaption>
  <div class="panel">
    <div class="band"><svg id="b-top" viewBox="0 0 380 250"></svg></div>
    <div class="rule"></div>
    <div class="band"><svg id="b-deck" viewBox="0 0 380 349"></svg></div>
    <div class="info">LOCATION UNKNOWN <span class="dim">· waiting for the game</span></div>
  </div>
</figure>

<figure>
  <figcaption>C · Ghost station<span>A dashed, faceless outline of "some station" over a few stars, a "?" on it; the plan band a faint grid, as an unplanned floor.</span></figcaption>
  <div class="panel">
    <div class="band"><svg id="c-top" viewBox="0 0 380 250"></svg></div>
    <div class="rule"></div>
    <div class="band"><svg id="c-deck" viewBox="0 0 380 349"></svg></div>
    <div class="info">LOCATION UNKNOWN</div>
  </div>
</figure>

<script>
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  function stars(g, w, h, n, seed) { const r = rng(seed); for (let i = 0; i < n; i++) el("circle", { cx: r() * w, cy: r() * h, r: r() * 1.3 + 0.3, fill: "#fff", opacity: r() * 0.6 + 0.12 }, g); }
  const q = (svg, x, y, size, fill = "#7d8a9a") => { const t = el("text", { x, y, "text-anchor": "middle", "dominant-baseline": "central", fill, "font-family": "DejaVu Sans, sans-serif", "font-size": size, "font-weight": 600 }, svg); t.textContent = "?"; return t; };

  // A
  const aTop = document.getElementById("a-top");
  stars(aTop, 380, 250, 150, 21);
  el("circle", { cx: 190, cy: 125, r: 46, fill: "#04060c", stroke: "#3b4a5c", "stroke-width": 1.5, "stroke-dasharray": "5 5" }, aTop);
  q(aTop, 190, 125, 34);
  const aDeck = document.getElementById("a-deck");
  stars(aDeck, 380, 349, 120, 9);
  el("rect", { x: 70, y: 70, width: 240, height: 180, rx: 10, fill: "#04060c", stroke: "#3b4a5c", "stroke-width": 1.5, "stroke-dasharray": "6 6" }, aDeck);
  q(aDeck, 190, 160, 30, "#3b4a5c");

  // B
  const bTop = document.getElementById("b-top");
  el("path", { d: "M190 172 C 172 146 156 128 156 106 A 34 34 0 1 1 224 106 C 224 128 208 146 190 172 Z", fill: "none", stroke: "#7d8a9a", "stroke-width": 2 }, bTop);
  q(bTop, 190, 106, 30);
  el("ellipse", { cx: 190, cy: 182, rx: 16, ry: 4, fill: "none", stroke: "#3b4a5c", "stroke-width": 1.5 }, bTop);
  const bt = el("text", { x: 190, y: 214, "text-anchor": "middle", fill: "#7d8a9a", "font-family": "DejaVu Sans Mono, monospace", "font-size": 11, "letter-spacing": 1 }, bTop);
  bt.textContent = "WHERE ARE YOU?";

  // C
  const cTop = document.getElementById("c-top");
  stars(cTop, 380, 250, 150, 31);
  const ghost = { fill: "#04060c", stroke: "#3b4a5c", "stroke-width": 1.5, "stroke-dasharray": "5 4", "stroke-linejoin": "round" };
  el("path", { d: "M110 125 L150 95 L230 95 L270 125 L230 155 L150 155 Z", ...ghost }, cTop);
  el("path", { d: "M150 95 L150 155 M230 95 L230 155 M110 125 L270 125", fill: "none", stroke: "#2b3646", "stroke-width": 1, "stroke-dasharray": "3 4" }, cTop);
  el("rect", { x: 182, y: 155, width: 16, height: 40, ...ghost }, cTop);
  el("circle", { cx: 190, cy: 125, r: 17, fill: "#04060c" }, cTop);
  q(cTop, 190, 125, 26);
  const cDeck = document.getElementById("c-deck");
  const grid = el("g", { stroke: "#18202b", "stroke-width": 1 }, cDeck);
  for (let x = 10; x < 380; x += 30) el("line", { x1: x, y1: 0, x2: x, y2: 349 }, grid);
  for (let y = 14; y < 349; y += 30) el("line", { x1: 0, y1: y, x2: 380, y2: y }, grid);
</script>
</body>
</html>
