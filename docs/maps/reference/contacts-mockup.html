<!doctype html>
<!-- Sweep contacts on the system chart, 2026-10-24: three looks for Space.Contacts (gmcp.md §8.5).
     Senara's system round Tamsin, her ship at Gannet Belt after a sweep 4m 10s ago: the Mule (named,
     at rest), Old Faithful (named, under drive), contact-1 (dark, seen by her signature), T.I.S.S.
     behind Tamsin, Orrin Station missed by a noisy sweep. The second frame is a chase: `travel
     contact-1`, her line drawn to where the sweep saw contact-1. The sweep's age is in the corner
     card in all three, never on the plan. A throwaway: take its look, not its code. -->
<html><head><meta charset="utf-8"><title>Sweep contacts: options</title>
<style>
  body { margin:0; background:#04060c; color:#7d8a9a; font:13px Inter, system-ui, sans-serif; padding:18px; }
  .row { display:flex; gap:26px; justify-content:center; align-items:flex-start; }
  figure { margin:0; text-align:center; }
  figcaption { margin:8px 0 2px; color:#e3eaf2; font-size:14px; }
  figcaption small { display:block; color:#7d8a9a; max-width:360px; margin:4px auto 0; font-size:12px; line-height:1.4; }
  .frame { position:relative; width:360px; height:300px; background:#04060c; border:1px solid #2b3646; border-radius:6px; overflow:hidden; margin-top:8px; }
  .cap { color:#7d8a9a; font-size:11px; text-align:left; margin:10px 0 -4px 2px; }
  svg { display:block; }
  text { font-family: Inter, system-ui, sans-serif; }
  .card { position:absolute; left:8px; bottom:8px; min-width:140px; padding:5px 8px 6px; border-radius:6px; background:rgba(14,19,26,.92);
          border:1px solid #2b3646; box-shadow:0 2px 10px rgba(0,0,0,.65); font:600 12px Inter, system-ui, sans-serif; color:#e3eaf2; text-align:left; }
  .card .d { font-weight:400; font-size:10px; color:#9aa7b7; margin-top:1px; white-space:nowrap; }
  .card .li { font-weight:400; font-size:10.5px; color:#cfd8e3; white-space:nowrap; display:flex; gap:8px; }
  .card .li span:last-child { margin-left:auto; color:#9aa7b7; }
  .card .amber { color:#ffb347; }
  .btns { position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:4px; }
  .btns i { display:block; width:22px; height:22px; border:1px solid #2b3646; border-radius:5px; }
  .tip { display:inline-block; text-align:left; margin-top:8px; background:#121821; border:1px solid #2b3646; border-radius:5px; padding:6px 9px; min-width:200px; }
  .tip b { display:block; color:#e3eaf2; font-weight:500; font-size:12px; } .tip span { color:#7d8a9a; font-size:11px; white-space:pre-line; }
</style></head><body>
<div class="row" id="row"></div>
<script>
const HL = "#ffb347", HL_STROKE = "#fff3df", DIM = "#7d8a9a", ORBIT = "#2b3646", GLASS = "#cfe3ff", STAR = "#fffaf0", TONES = ["#3a4556", "#58667b", "#7e8da3"];
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent, text) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  parent?.appendChild(n);
  return n;
};
const label = (g, x, y, t, anchor = "start", fill = DIM, size = 10, extra = {}) => el("text", { x, y, "font-size": size, fill, "text-anchor": anchor, ...extra }, g, t);

// the scene, px in a 360 x 300 band
const TAMSIN = [175, 165], HER = [262, 92];
const CONTACTS = [
  { kind: "ship", name: "the Mule", at: [292, 70], moving: false, hull: "prospecting skiff", owner: "Dilbo's", km: 410 },
  { kind: "ship", name: "Old Faithful", at: [78, 62], moving: true, hull: "medium freighter", owner: "Annet's", km: 6200 },
  { kind: "unknown", name: "contact-1", at: [62, 236], moving: true, km: 7400 },
];
const TISS = [148, 186]; // behind Tamsin from her
const ORRIN_ST = [318, 252]; // missed

function base(svg) {
  // stars
  let s = 31;
  for (let i = 0; i < 70; i++) { s = (s * 9301 + 49297) % 233280; const x = (s / 233280) * 360; s = (s * 9301 + 49297) % 233280; const y = (s / 233280) * 300;
    el("circle", { cx: x, cy: y, r: 0.5, fill: "#fff", opacity: 0.25 }, svg); }
  // orbits
  el("circle", { cx: TAMSIN[0], cy: TAMSIN[1], r: 34, fill: "none", stroke: ORBIT }, svg); // T.I.S.S.
  el("circle", { cx: TAMSIN[0], cy: TAMSIN[1], r: 110, fill: "none", stroke: ORBIT }, svg); // Gannet
  el("circle", { cx: -60, cy: 520, r: 470, fill: "none", stroke: ORBIT }, svg); // Tamsin round Senara
  // Gannet belt arc where she is
  for (let i = 0; i < 12; i++) {
    const f = (i + 0.5) / 12, a0 = -0.95 + i * 0.05, a1 = a0 + 0.05;
    const p = (a) => [TAMSIN[0] + 110 * Math.cos(a), TAMSIN[1] + 110 * Math.sin(a)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    el("path", { d: `M${x0},${y0} L${x1},${y1}`, stroke: TONES[2], "stroke-width": 5, "stroke-linecap": "round", "stroke-opacity": 0.15 + 0.6 * (1 - Math.abs(2 * f - 1)) }, svg);
  }
  label(svg, 236, 122, "Gannet Belt ±120", "middle");
  // Tamsin, lit toward Senara (down-left)
  el("circle", { cx: TAMSIN[0], cy: TAMSIN[1], r: 13, fill: TONES[0], stroke: "#0d1218" }, svg);
  el("path", { d: `M${TAMSIN[0] - 9.2},${TAMSIN[1] - 9.2} A13,13 0 0 0 ${TAMSIN[0] + 9.2},${TAMSIN[1] + 9.2} Z`, fill: TONES[2] }, svg);
  label(svg, TAMSIN[0], TAMSIN[1] + 27, "Tamsin", "middle");
  // scale bar
  el("line", { x1: 16, y1: 18, x2: 76, y2: 18, stroke: DIM }, svg);
  for (const x of [16, 76]) el("line", { x1: x, y1: 15, x2: x, y2: 21, stroke: DIM }, svg);
  label(svg, 46, 12, "2,000 km", "middle", DIM, 9);
}
const chevron = (svg, [x, y], deg) => el("path", { d: "M7,0 L-5,-5 L-2,0 L-5,5 Z", fill: HL, stroke: HL_STROKE, "stroke-width": 0.8, "stroke-linejoin": "round", transform: `translate(${x} ${y}) rotate(${deg})` }, svg);
const diamond = (g, [x, y], attrs) => el("rect", { x: x - 2.6, y: y - 2.6, width: 5.2, height: 5.2, transform: `rotate(45 ${x} ${y})`, ...attrs }, g);

// --- the options ---------------------------------------------------------------------------
const OPTIONS = [
  {
    title: "A · Blips",
    note: "A ship is a small ring at where the sweep saw her: Glass and named for one on her transponder, a dot inside her at rest, empty under drive; a dark ship a dim dashed ring named only “contact-1”. T.I.S.S. behind Tamsin is a hollow diamond, “behind Tamsin” under it; a missed station a dashed one, “no return”. The card: the sweep's age and a count.",
    ship(g, c) {
      const named = c.kind === "ship";
      el("circle", { cx: c.at[0], cy: c.at[1], r: 4, fill: "none", stroke: named ? GLASS : DIM, "stroke-width": 1.2, ...(named ? {} : { "stroke-dasharray": "2 1.6" }) }, g);
      if (named && !c.moving) el("circle", { cx: c.at[0], cy: c.at[1], r: 1.4, fill: GLASS }, g);
      label(g, c.at[0] + 8, c.at[1] + 3.5, c.name, "start", named ? "#aebccc" : DIM);
    },
    hidden(g, p, by) { diamond(g, p, { fill: "none", stroke: GLASS, "stroke-width": 1, opacity: 0.6 }); label(g, p[0], p[1] + 14, `T.I.S.S. · behind ${by}`, "middle"); },
    missed(g, p) { diamond(g, p, { fill: "none", stroke: DIM, "stroke-width": 1, "stroke-dasharray": "1.6 1.4" }); label(g, p[0] - 7, p[1] + 3.5, "Orrin Station · no return", "end"); },
    card: (chase) => chase
      ? `<div>After contact-1</div><div class="d">where the sweep saw her, 2m 40s ago</div>`
      : `<div>Sweep, 4m 10s ago</div><div class="d">2 ships · 1 contact · 1 behind Tamsin · 1 missed</div>`,
  },
  {
    title: "B · Brackets",
    note: "A target's brackets round where the sweep saw her: Glass with her name and her hull on a second line for one named; a dark ship's brackets dim and empty, “contact-1”. Under drive, the brackets are open at the sides. Behind Tamsin, the station is dim with a faint line to Tamsin's limb; missed, its brackets are struck through. The card: the sweep's age.",
    ship(g, c) {
      const named = c.kind === "ship";
      const [x, y] = c.at, r = 5, k = 2.6;
      const col = named ? GLASS : DIM;
      const d = c.moving
        ? `M${x - r},${y - r + k} V${y - r} H${x - r + k} M${x + r - k},${y - r} H${x + r} V${y - r + k} M${x + r},${y + r - k} V${y + r} H${x + r - k} M${x - r + k},${y + r} H${x - r} V${y + r - k}`
        : `M${x - r},${y - r + k} V${y - r} H${x - r + k} M${x + r - k},${y - r} H${x + r} V${y - r + k} M${x + r},${y + r - k} V${y + r} H${x + r - k} M${x - r + k},${y + r} H${x - r} V${y + r - k}`;
      el("path", { d, fill: "none", stroke: col, "stroke-width": 1.2 }, g);
      if (named) el("circle", { cx: x, cy: y, r: 1.3, fill: GLASS }, g);
      if (c.moving) { el("line", { x1: x - r - 3, y1: y, x2: x - r - 1, y2: y, stroke: col }, g); el("line", { x1: x + r + 1, y1: y, x2: x + r + 3, y2: y, stroke: col }, g); }
      label(g, x + 10, y + 1, c.name, "start", named ? "#aebccc" : DIM);
      if (named) label(g, x + 10, y + 11, `${c.hull.split(" ").pop()}${c.moving ? " · under drive" : ""}`, "start", DIM, 9);
    },
    hidden(g, p, by) {
      el("line", { x1: p[0], y1: p[1], x2: TAMSIN[0] - 7, y2: TAMSIN[1] + 9, stroke: DIM, "stroke-dasharray": "1 3", opacity: 0.7 }, g);
      diamond(g, p, { fill: GLASS, opacity: 0.35 });
      label(g, p[0] - 6, p[1] + 12, `T.I.S.S., behind ${by}`, "end", DIM, 10, { "font-style": "italic" });
    },
    missed(g, p) {
      diamond(g, p, { fill: GLASS, opacity: 0.35 });
      el("line", { x1: p[0] - 6, y1: p[1] + 6, x2: p[0] + 6, y2: p[1] - 6, stroke: DIM, "stroke-width": 1.2 }, g);
      label(g, p[0] - 9, p[1] + 3.5, "Orrin Station, missed", "end", DIM, 10, { "font-style": "italic" });
    },
    card: (chase) => chase
      ? `<div><span class="amber">▸</span> contact-1</div><div class="d">last seen 2m 40s ago</div>`
      : `<div>Last sweep</div><div class="d">4m 10s ago</div>`,
  },
  {
    title: "C · Quiet marks, the card lists",
    note: "Ships are small Glass crosses (dim for a dark one), named beside them; nothing else on the plan changes but a “?” on a missed station and T.I.S.S. dimmed. The card unfolds into the sweep's list: each contact with how far it was, “behind Tamsin”, “missed”, hull and owner on hover.",
    ship(g, c) {
      const named = c.kind === "ship";
      const [x, y] = c.at;
      el("path", { d: `M${x - 3.5},${y} H${x + 3.5} M${x},${y - 3.5} V${y + 3.5}`, stroke: named ? GLASS : DIM, "stroke-width": 1.3 }, g);
      label(g, x + 7, y + 3.5, c.name, "start", named ? "#aebccc" : DIM);
    },
    hidden(g, p) { diamond(g, p, { fill: GLASS, opacity: 0.3 }); },
    missed(g, p) { diamond(g, p, { fill: GLASS, opacity: 0.3 }); label(g, p[0] + 6, p[1] - 3, "?", "start", DIM, 10); },
    card: (chase) => chase
      ? `<div>After contact-1 <span class="d" style="display:inline">· 2m 40s ago</span></div>`
      : `<div>Sweep <span class="d" style="display:inline">· 4m 10s ago</span></div>
         <div class="li"><span>the Mule</span><span>410 km</span></div>
         <div class="li"><span>Old Faithful ▸</span><span>6,200 km</span></div>
         <div class="li"><span>contact-1 ▸</span><span>7,400 km</span></div>
         <div class="li"><span>T.I.S.S.</span><span>behind Tamsin</span></div>
         <div class="li"><span>Orrin Station</span><span>missed</span></div>`,
  },
];

function frame(opt, chase) {
  const f = document.createElement("div");
  f.className = "frame";
  const svg = el("svg", { width: 360, height: 300, viewBox: "0 0 360 300" }, f);
  base(svg);
  const g = el("g", {}, svg);
  opt.hidden(g, TISS, "Tamsin");
  opt.missed(g, ORRIN_ST);
  for (const c of CONTACTS) opt.ship(g, c);
  if (chase) {
    // her trip to where the sweep saw contact-1, solid behind, dashed ahead, a ring at its end
    const me = [200, 148], to = CONTACTS[2].at;
    el("line", { x1: HER[0], y1: HER[1], x2: me[0], y2: me[1], stroke: HL, "stroke-opacity": 0.25, "stroke-width": 1.2 }, svg);
    el("line", { x1: me[0], y1: me[1], x2: to[0], y2: to[1], stroke: HL, "stroke-opacity": 0.55, "stroke-width": 1.2, "stroke-dasharray": "4 4" }, svg);
    el("circle", { cx: to[0], cy: to[1], r: 8, fill: "none", stroke: HL, "stroke-opacity": 0.7, "stroke-width": 1.2 }, svg);
    chevron(svg, me, (Math.atan2(to[1] - me[1], to[0] - me[0]) * 180) / Math.PI);
  } else chevron(svg, HER, -90);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = opt.card(chase);
  f.appendChild(card);
  const b = document.createElement("div");
  b.className = "btns";
  b.innerHTML = "<i></i><i></i><i></i><i></i>";
  f.appendChild(b);
  return f;
}

const row = document.getElementById("row");
for (const opt of OPTIONS) {
  const fig = document.createElement("figure");
  fig.innerHTML = `<figcaption>${opt.title}<small>${opt.note}</small></figcaption>`;
  const c1 = document.createElement("div"); c1.className = "cap"; c1.textContent = "After a sweep at Gannet Belt"; fig.appendChild(c1);
  fig.appendChild(frame(opt, false));
  const c2 = document.createElement("div"); c2.className = "cap"; c2.textContent = "Chasing contact-1 (travel contact-1)"; fig.appendChild(c2);
  fig.appendChild(frame(opt, true));
  const tip = document.createElement("div");
  tip.className = "tip";
  tip.innerHTML = `<b>Old Faithful</b><span>medium freighter, Annet's\nunder drive, 6,200 km off at the sweep</span>`;
  fig.appendChild(tip);
  row.appendChild(fig);
}
</script></body></html>
