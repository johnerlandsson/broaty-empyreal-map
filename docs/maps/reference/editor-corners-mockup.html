<!doctype html>
<!-- Rounded rooms, 2026-10-27: how a footprint's r shows on the plan (today the plan's room box takes
     its 14-unit inset off the radius, so r 0.2 barely shows), and rounding or cutting the corners of
     a room drawn by its outline, as every ship room is. The plans are the plugin's own (buildPlace,
     buildShip); each room's drawn shape is then replaced with the option's. Serve the repo root over
     http to open it (npm run edit serves it). A throwaway: take its look, not its code. -->
<html><head><meta charset="utf-8"><title>Rounded rooms: options</title>
<style>
  body { margin:0; background:#0b0f16; color:#7d8a9a; font:13px Inter, system-ui, sans-serif; padding:12px 20px; width:1500px; }
  h2 { color:#e3eaf2; font-size:16px; margin:18px 0 2px; }
  h2 small { color:#8f9bab; font-weight:400; font-size:12.5px; }
  .grid { display:grid; grid-template-columns: 260px repeat(3, 1fr); gap:8px; margin-top:8px; align-items:stretch; }
  .grid.ship { grid-template-columns: 260px repeat(3, 1fr); }
  .head { color:#b9c5d3; font-size:12.5px; align-self:end; padding-bottom:2px; }
  .lab { color:#b9c5d3; font-size:12.5px; line-height:1.45; padding-top:6px; }
  .lab b { color:#e3eaf2; }
  .pane { position:relative; height:220px; background:#04060c; border-radius:6px; outline:1px solid #222c3a; overflow:hidden; }
  .grid.ship .pane { height:470px; }
  .pane .slot { position:absolute; inset:0; }
  .pane .model { display:none; }
  .pane button, .pane .zoom { display:none !important; }
  .pane .tag { position:absolute; left:8px; top:6px; z-index:4; font:10.5px "DejaVu Sans Mono", monospace; color:#9aa7b7; letter-spacing:.5px; pointer-events:none; }
</style></head><body>
<h2>1 · How r shows on the plan <small>Kilmar's Exchange, corners rounded. The overview measures r from the cell's edge; the plan draws the room 14 units in from it.</small></h2>
<div class="grid" id="radius"></div>
<h2>2 · Rounding a room drawn by its outline <small>The medium freighter's plan; every room is an outline from the game's plan, today always square.</small></h2>
<div class="grid ship" id="ship"></div>
<script type="module">
import kilmar from "../../../ui/data/kilmar.js";
import freighter from "../../../ui/data/plans/freighter.js";
import { buildPlace, buildShip } from "../../../ui/place-views.js";
import { cornered } from "../../../ui/lib/footprint.js";
import { PLAN } from "../../../ui/lib/decks.js";

const RADII = [["rounded, no r (0.2)", undefined], ["r 0.1", 0.1], ["r 0.35", 0.35]];
const ROWS = [
  ["A", "<b>A · Today.</b> The plan takes its inset off r, so its corner is the overview's, moved in: r 0.2 is 14 × 6 units, r 0.1 nothing at all."],
  ["B", "<b>B · r on the drawn box.</b> The plan's corner is r of a cell on the room box itself, so r 0.2 looks like 0.2. The plan is a little rounder than the overview."],
  ["C", "<b>C · As today, a rounder default.</b> Nothing changes for a given r, but rounded without one is r 0.35, so picking rounded shows. r 0.1 still shows nothing."],
];
const pathOf = (pts) => `M${pts.map((p) => p.map((v) => +v.toFixed(1)).join(",")).join("L")}Z`;

function mount(cell, title) {
  const pane = document.createElement("div");
  pane.className = "pane";
  pane.innerHTML = `<span class="tag">${title}</span><div class="slot model"></div><div class="slot deck"></div>`;
  cell.append(pane);
  return pane;
}

// --- 1: the radius ------------------------------------------------------------------------------
const radius = document.querySelector("#radius");
radius.insertAdjacentHTML("beforeend", `<div></div>${RADII.map(([t]) => `<div class="head">${t}</div>`).join("")}`);
for (const [opt, text] of ROWS) {
  radius.insertAdjacentHTML("beforeend", `<div class="lab">${text}</div>`);
  for (const [, r] of RADII) {
    const cell = document.createElement("div");
    radius.append(cell);
    const pane = mount(cell, "");
    const data = structuredClone(kilmar);
    const fp = { corners: "rounded" };
    if (r !== undefined) fp.r = r;
    else if (opt === "C") fp.r = 0.35;
    data.look.footprints = { ...data.look.footprints, market: fp };
    const views = buildPlace(data, "decks", pane.querySelector(".model"), pane.querySelector(".deck"), { pick: true });
    const plan = views.deck.plans[views.deck.level];
    const c = plan.layout.cells.find((x) => x.room.id === "kilmar.market");
    if (opt === "B") {
      // the box as drawn, its corners r of a cell on it
      const rr = fp.r ?? 0.2;
      const box = { x0: -c.w / 2, x1: c.w / 2, y0: -c.h / 2, y1: c.h / 2 };
      const shape = plan.g.querySelector('[data-room="kilmar.market"] path, [data-room="kilmar.market"] rect');
      const d = pathOf(cornered(box, "rounded", rr * PLAN.w, rr * PLAN.h).map(([x, y]) => [c.cx + x, c.cy - y]));
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      for (const a of shape.attributes) if (!["x", "y", "width", "height", "rx", "d"].includes(a.name)) p.setAttribute(a.name, a.value);
      p.setAttribute("d", d);
      shape.replaceWith(p);
    }
    views.deck.setView([c.cx - c.w * 1.3, c.cy - c.h * 1.45, c.w * 2.6, c.h * 2.9]);
  }
}

// --- 2: outlines ----------------------------------------------------------------------------------
/** A polygon (plan units, as drawn) with each corner rounded or cut by r cells, PLAN's units on each axis. */
function shaped(points, kind, r) {
  const toCells = ([x, y]) => [x / PLAN.w, y / PLAN.h];
  const pts = points.map(toCells);
  const out = [];
  pts.forEach((p, i) => {
    const a = pts[(i + pts.length - 1) % pts.length], b = pts[(i + 1) % pts.length];
    const unit = (q) => { const d = [q[0] - p[0], q[1] - p[1]]; const m = Math.hypot(...d); return d.map((v) => v / m); };
    const ua = unit(a), ub = unit(b);
    const la = Math.hypot(a[0] - p[0], a[1] - p[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]);
    const theta = Math.acos(Math.max(-1, Math.min(1, ua[0] * ub[0] + ua[1] * ub[1])));
    if (theta > Math.PI - 1e-3) return out.push(p);
    const t = Math.min(kind === "cut" ? r : r / Math.tan(theta / 2), la / 2, lb / 2);
    const t1 = [p[0] + ua[0] * t, p[1] + ua[1] * t], t2 = [p[0] + ub[0] * t, p[1] + ub[1] * t];
    if (kind === "cut") return out.push(t1, t2);
    const rr = t * Math.tan(theta / 2);
    const bis = [ua[0] + ub[0], ua[1] + ub[1]], bm = Math.hypot(...bis);
    const hgt = rr / Math.sin(theta / 2);
    const c = [p[0] + (bis[0] / bm) * hgt, p[1] + (bis[1] / bm) * hgt];
    let a1 = Math.atan2(t1[1] - c[1], t1[0] - c[0]), a2 = Math.atan2(t2[1] - c[1], t2[0] - c[0]);
    let d = a2 - a1;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    for (let k = 0; k <= 6; k++) out.push([c[0] + rr * Math.cos(a1 + (d * k) / 6), c[1] + rr * Math.sin(a1 + (d * k) / 6)]);
  });
  return out.map(([x, y]) => [x * PLAN.w, y * PLAN.h]);
}

const SHIP = [
  ["Today", "square", 0],
  ["Rounded, r 0.25", "rounded", 0.25],
  ["Cut, r 0.25", "cut", 0.25],
];
const ship = document.querySelector("#ship");
ship.insertAdjacentHTML("beforeend", `<div></div>${SHIP.map(([t]) => `<div class="head">${t}</div>`).join("")}`);
ship.insertAdjacentHTML("beforeend", `<div class="lab"><b>corners and r on an outline.</b> Each corner of the drawn outline is rounded or cut by r (measured as you pick in 1). Set per room as for a station (<code>"corners": "rounded"</code> next to the outline), so the panel's switches work on ship rooms too. The overview's rooms would round the same.</div>`);
for (const [, kind, r] of SHIP) {
  const cell = document.createElement("div");
  ship.append(cell);
  const pane = mount(cell, "");
  const views = buildShip(structuredClone(freighter), pane.querySelector(".model"), pane.querySelector(".deck"), { name: "Example", pick: true });
  const plan = views.deck.plans[views.deck.level];
  const f = plan.layout.footprint;
  views.deck.setView([f.x - 30, f.y - 20, f.w + 60, f.h + 40]);
  if (kind === "square") continue;
  for (const c of plan.layout.cells) {
    if (c.kind !== "room" || !c.points) continue;
    const shape = plan.g.querySelector(`[data-room="${c.room.id}"] path, [data-room="${c.room.id}"] rect`);
    if (!shape) continue;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    for (const a of shape.attributes) if (!["x", "y", "width", "height", "rx", "d"].includes(a.name)) p.setAttribute(a.name, a.value);
    // c.points are as drawn, y down; round them as they are
    p.setAttribute("d", pathOf(shaped(c.points, kind, r)));
    p.setAttribute("stroke-linejoin", "round");
    shape.replaceWith(p);
  }
}
document.body.dataset.ready = "1";
</script>
</body></html>
