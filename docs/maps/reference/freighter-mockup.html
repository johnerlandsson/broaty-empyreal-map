<!doctype html>
<!-- Freighter plan options, 2026-10-22: three ways to draw the medium freighter (content/plans/freighter.yaml
     in ~/dev/empyreal), fore up, the Passage lit. Fonts at the plan's real size (12 and 10 plan units
     are 7.5 and 6.25 here). A throwaway: take its look, not its code. See docs/maps/ship-plans.md. -->
<html><head><meta charset="utf-8"><title>Freighter: options</title>
<style>
  body { margin:0; background:#04060c; color:#7d8a9a; font:13px Inter, system-ui, sans-serif; display:flex; gap:28px; justify-content:center; padding:20px; }
  figure { margin:0; text-align:center; }
  figcaption { margin-top:6px; color:#e3eaf2; }
  figcaption small { display:block; color:#7d8a9a; max-width:260px; margin:4px auto 0; }
  svg { width:260px; height:403px; }
  text { font-family: Inter, system-ui, sans-serif; }
  .hull { fill:#04060c; stroke:#9fb0c3; stroke-width:1.6; }
  .room { fill:#7d8a9a; fill-opacity:.22; stroke:#7d8a9a; stroke-opacity:.85; stroke-width:1; }
  .here { fill:#ffb347; fill-opacity:.3; stroke:#ffb347; stroke-opacity:1; stroke-width:1.9; }
  .lbl { fill:#e3eaf2; font-size:7.5px; text-anchor:middle; dominant-baseline:middle; }
  .cap { fill:#7d8a9a; font-size:6.25px; text-anchor:middle; }
  .dim { fill:none; stroke:#7d8a9a; stroke-width:1.2; }
  .dim[stroke] { stroke:#e8b04a; }
  .fix { fill:none; stroke:#e3eaf2; stroke-width:1; }
</style></head><body>

<!-- A: one boxy hull, every room inside it, laid out as the game's grid but sized by what each room is -->
<figure><svg viewBox="0 0 200 310">
  <path class="hull" d="M64,58 Q64,8 100,8 Q136,8 136,58 L160,58 Q168,58 168,66 L168,256 L158,268 L42,268 L32,256 L32,66 Q32,58 40,58 Z"/>
  <!-- airlock outer hatch (port), docking collar ring with chevrons (starboard) -->
  <rect class="dim" x="27" y="74" width="5" height="16" rx="1"/>
  <rect class="dim" x="168" y="70" width="7" height="24" rx="2"/>
  <path class="dim" d="M170,75 l3,3 l-3,3 M170,83 l3,3 l-3,3" stroke="#e8b04a" stroke-width="1"/>
  <!-- rooms -->
  <rect class="room" x="75" y="25" width="50" height="29" rx="7"/>
  <rect class="room" x="38" y="64" width="34" height="36" rx="4"/>
  <rect class="here" x="76" y="64" width="48" height="36" rx="4"/>
  <rect class="room" x="128" y="64" width="34" height="36" rx="4"/>
  <rect class="room" x="38" y="106" width="124" height="100" rx="4"/>
  <rect class="room" x="38" y="212" width="124" height="48" rx="4"/>
  <!-- fixtures: two seats side by side; tie-down rails along the hold's walls -->
  <path class="fix" d="M87,40 h10 v6 h-10 z M87,46 l2,3 h6 l2,-3 M103,40 h10 v6 h-10 z M103,46 l2,3 h6 l2,-3"/>
  <path class="fix" d="M45,114 v84 M155,114 v84 M45,128 h4 M45,142 h4 M45,156 h4 M45,170 h4 M45,184 h4 M155,128 h-4 M155,142 h-4 M155,156 h-4 M155,170 h-4 M155,184 h-4" opacity=".6"/>
  <!-- drive bells -->
  <path class="dim" d="M64,269 Q64,280 56,294 L84,294 Q76,280 76,269 Z M124,269 Q124,280 116,294 L144,294 Q136,280 136,269 Z" stroke-width="1.3"/>
  <!-- labels -->
  <text class="lbl" x="100" y="32">Cockpit</text>
  <text class="lbl" x="55" y="82">Airlock</text>
  <text class="lbl" x="100" y="82">Passage</text>
  <text class="lbl" x="145" y="82">Collar</text>
  <text class="lbl" x="100" y="156">Hold</text>
  <text class="lbl" x="100" y="236">Engine Room</text>
  <text class="cap" x="100" y="306">Old Reliable · medium freighter</text>
</svg><figcaption>A · Boxy hull, all inside<small>Matches "a boxy hull, mostly hold". Airlock and collar are side rooms inside the hull; the collar's ring and the outer hatch are marks on the flanks. Hold dominates.</small></figcaption></figure>

  <text class="lbl" x="100" y="32">Cockpit</text>
  <text class="lbl" x="36" y="83">Airlock</text>
  <text class="lbl" x="100" y="83">Passage</text>
  <text class="lbl" x="164" y="83">Collar</text>
  <text class="lbl" x="100" y="158">Hold</text>

</body></html>
