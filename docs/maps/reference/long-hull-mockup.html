     (cupcake's idea), its plan a big grid repeating left-right with walls and doorways (Dilbo's).

{ // every room a door: to a street if it has one, else to a neighbour already joined
  const r = rng(7), joined = new Set();
  for (const room of rooms) {

    if (s.length) { const [a, b] = s[Math.floor(r() * s.length)]; addDoor(a, b); joined.add(room.id); }
  }
  for (let pass = 0; pass < 6; pass++) for (const room of rooms) {
    if (joined.has(room.id)) continue;
    const s = near(room).filter(([, o]) => { const t = owner[wrap(o[0])]?.[o[1]]; return t && joined.has(t.id); });

const hourLabel = (c) => `${Math.floor(c / 2) || 12}:${c % 2 ? "30" : "00"}`;
const roomAt = (c, r) => owner[c][r];

// ---- the plan
function metrics(mode) {

let uid = 0;

// ---- the model: a tube of flat faces, its tail tapered, its mouth cut at a slant
const LEN = 8.8, R = 1, RI = 0.7, TAIL = 0.26, FACES = 64; // TAIL: the share of her length that's drive, not decks
const LIVE = LEN * (1 - TAIL);

const mouthS = (hrAng) => LEN - (LIVE * (NOTCH / ROWS) * (1 - Math.cos(hrAng))) / 2;
