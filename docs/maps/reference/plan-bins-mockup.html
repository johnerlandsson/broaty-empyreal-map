<!doctype html>
<!-- Refuse bins on the plans, 2026-10-29: three ways to mark a room with the `bin` flag (Empyreal
     bins.md, 0f28409 to 2e99642) on the 2D plans. Real plans from ui/: T.I.S.S.'s Rim from 11:00 to
     3:00 (the Main Concourse, a corridor stop, and the Stalls, Market Hall, Slag Heap, Washrooms,
     Laundry and Bunkhouse), the same Rim zoomed right out, Inner 12:00 (Freight Hall and the cleaners'
     dock in Ladderway 12, drawn as its hatch), the freighter (her Passage) and a skiff (her cockpit).
     Each frame is the panel's bottom band at its default size, 380 x 300. Serve the repo root over
     http to open it. A throwaway: take its look, not its code. Picked: B (2026-10-29). -->
<html><head><meta charset="utf-8"><title>Plan bins: options</title>
<style>
  body { margin:0; background:#04060c; color:#7d8a9a; font:13px Inter, system-ui, sans-serif; padding:14px 18px; width:max-content; }
  h2 { color:#e3eaf2; font-size:15px; margin:14px 0 2px; }
  h2 small { color:#7d8a9a; font-weight:400; font-size:12px; margin-left:8px; }
  .row { display:flex; gap:10px; margin:6px 0 2px; }
  figure { margin:0; text-align:center; }
  figcaption { font:11px "DejaVu Sans Mono", monospace; margin-top:3px; }
  .f { position:relative; width:380px; height:300px; background:#04060c; border-radius:6px; overflow:hidden; outline:1px solid #18202b; }
  .f .m { position:absolute; inset:0; }
  .f .m button { display:none; }
  .zoom { position:absolute; left:8px; top:6px; font:10px "DejaVu Sans Mono", monospace; color:#7d8a9a; }
  .key { display:flex; gap:28px; margin:4px 0 10px; align-items:center; }
  .key svg { background:#0b0f16; border-radius:6px; }
</style></head><body>
<div id="out"></div>
<script type="module">
import { DeckView, DIM } from "../../../ui/deck-view.js";
import { el } from "../../../ui/lib/svg.js";
import { NODE, CH } from "../../../ui/lib/deck-layout.js";
import { indexStation, locate } from "../../../ui/lib/locate.js";
import { indexDecks, locateDecks } from "../../../ui/lib/decks.js";
import { tissRooms } from "../../../ui/lib/look.js";
import { decksPlans } from "../../../ui/decks-deck.js";
import { captionShip, updateShip } from "../../../ui/ship-deck.js";
import { data } from "../../../ui/data/places.js";
import { plans as shipPlans } from "../../../ui/data/ships.js";

const FIX_FILL = "#0e131a", FIX_LINE = "#cfd8e3", LADDER = "#9fb0c3";
const BINS = ["tiss.freight", "tiss.refinery", "tiss.fabricator", "tiss.workshops", "tiss.concourse", "tiss.market",
  "tiss.cantina", "tiss.stalls", "tiss.washrooms", "tiss.laundry", "tiss.bunkhouse", "tiss.dayroom", "tiss.court",
  "tiss.terminals", "tiss.gym", "freighter.passage", "hull-skiff.cockpit"];
const DOCKS = [0, 3, 6, 9]; // the Inner ladderways, the cleaners' docks: each at its lobby's hatch

// the bin: a lidded can, its handle and two ribs, 10 x 12 at scale 1, centred on 0,0
const CAN = "M-5,-3.6h10M-1.6,-3.6v-1.6h3.2v1.6M-4,-3.6L-3.2,5.4H3.2L4,-3.6M-1.2,-1.6v5M1.2,-1.6v5";
const can = (p, x, y, s, stroke, w = 1.1) =>
  el("path", { d: CAN, transform: `translate(${x} ${y}) scale(${s})`, fill: "none", stroke, "stroke-width": w / s, "stroke-linecap": "round", "stroke-linejoin": "round", "pointer-events": "none" }, p);

// Each option draws a bin for a room box `b` ({x, y, w, h, side}: side -1 fore of the corridor, 1 aft, 0 a ship's
// room) or for a corridor spot `c` ({x, y}: where on the corridor, right of a stop's fixtures). `k` is screen px a unit.
const OPTIONS = [
  { key: "A", title: "A · A fixture in the corner", sub: "a bin on Fixture fill, edged and drawn in Fixture line like the lift and the hatch; in the room's far corner, spinward; on the corridor, beside the hatch. Zooms with the plan.",
    room(p, b) {
      const s = 14, x = b.x + b.w - s - 6, y = b.side > 0 ? b.y + b.h - s - 6 : b.y + 6 + (b.cut ? 4 : 0);
      el("rect", { x, y, width: s, height: s, rx: 2, fill: FIX_FILL, stroke: FIX_LINE, "stroke-width": 1.1, "pointer-events": "none" }, p);
      can(p, x + s / 2, y + s / 2 + 0.3, 0.95, FIX_LINE);
    },
    spot(p, c) {
      el("rect", { x: c.x - 7, y: c.y - 7, width: 14, height: 14, rx: 2, fill: FIX_FILL, stroke: FIX_LINE, "stroke-width": 1.1, "pointer-events": "none" }, p);
      can(p, c.x, c.y + 0.3, 0.95, FIX_LINE);
    } },
  { key: "B", title: "B · A quiet mark in the corner", sub: "just the bin's outline in Dim, no tile, a little smaller, in the same corner; on the corridor, beside the hatch. Zooms with the plan, so it goes when the names go.",
    room(p, b) {
      const x = b.x + b.w - 11, y = b.side > 0 ? b.y + b.h - 11 : b.y + 11 + (b.cut ? 4 : 0);
      can(p, x, y, 0.85, DIM, 1.2);
    },
    spot(p, c) { can(p, c.x, c.y, 0.85, DIM, 1.2); } },
  { key: "C", title: "C · A badge on the wall, always legible", sub: "a round badge on the room's spinward wall, halfway down, Fixture fill ringed in Ladder, the same 13 px on screen at any zoom, so it's still there zoomed right out; on the corridor, beside the hatch.",
    room(p, b, k) {
      badge(p, b.x + b.w + (b.cut ? b.cut * 0.5 : 0), b.y + b.h / 2, k);
    },
    spot(p, c, k) { badge(p, c.x, c.y, k); } },
];
function badge(p, x, y, k) {
  const r = 6.5 / k; // 13 px across on screen
  el("circle", { cx: x, cy: y, r, fill: FIX_FILL, stroke: LADDER, "stroke-width": 1.1 / k, "pointer-events": "none" }, p);
  can(p, x, y + 0.2 / k, 0.68 / k, FIX_LINE, 1 / k);
}

const W = 380, H = 300, ASPECT = H / W;
const tiss = data.tiss;

// a frame: the panel's bottom band with a real plan in it, lit where `where` says, framed at `view`
function frame(row, cap, make, note) {
  const fig = row.appendChild(document.createElement("figure"));
  const f = fig.appendChild(document.createElement("div"));
  f.className = "f";
  const m = f.appendChild(document.createElement("div"));
  m.className = "m";
  if (note) f.appendChild(Object.assign(document.createElement("div"), { className: "zoom", textContent: note }));
  fig.appendChild(Object.assign(document.createElement("figcaption"), { textContent: cap }));
  return make(m);
}

function ring(m, opt, level, roomId, centreHour, width) {
  const index = indexStation(tissRooms(tiss));
  const deck = new DeckView(m, index, undefined, { pick: true });
  const where = locate(index, { roomId });
  deck.set(where);
  const plan = deck.plans[level];
  const stop = plan.layout.stops.find((s) => s.hour === centreHour);
  deck.setView([stop.cx - width / 2, -width * ASPECT / 2 + (where.y ?? 0) * 0, width, width * ASPECT]);
  const k = W / width;
  const g = el("g", { "pointer-events": "none" }, plan.g);
  for (const id of BINS) {
    for (const node of plan.g.querySelectorAll(`[data-room="${id}"]`)) {
      if (node.tagName === "rect") { // a corridor stop's hit area: the bin beside its fixtures
        const cx = +node.getAttribute("x") + NODE / 2;
        opt.spot(node.parentNode, { x: cx + 47, y: 0 }, k);
        continue;
      }
      const r = node.firstChild;
      const b = { x: +r.getAttribute("x"), y: +r.getAttribute("y"), w: +r.getAttribute("width"), h: +r.getAttribute("height") };
      b.side = b.y + b.h / 2 < 0 ? -1 : 1;
      opt.room(node.parentNode, b, k);
    }
  }
  if (level === 2) for (const st of plan.layout.stops) if (DOCKS.includes(st.hour % 12))
    for (const off of plan.offsets) opt.spot(el("g", { transform: `translate(${off} 0)` }, g), { x: st.cx + 47, y: 0 }, k);
  plan.g.appendChild(plan.hl); // keep the light on top, as it is
}

function ship(m, opt, planId, name, hullName, roomId, zoomOut) {
  const raw = shipPlans[planId];
  const plan = { ...raw, rooms: raw.rooms.map((r) => ({ ...r, name: r.name.replaceAll("{name}", name) })) };
  const index = indexDecks(plan);
  const deck = new DeckView(m, index, decksPlans(plan), { pick: true });
  captionShip(deck);
  deck.set(locateDecks(index, { roomId }));
  deck.setView(deck.homeView());
  if (zoomOut) { const [x, y, w, h] = deck.cur; deck.setView([x + w / 2 - 800, y + h / 2 - 800 * ASPECT, 1600, 1600 * ASPECT]); }
  updateShip(deck, { areaName: name, hullName });
  const k = W / deck.cur[2];
  const p = deck.plans[deck.level];
  for (const id of BINS) for (const node of p.g.querySelectorAll(`g[data-room="${id}"]`)) {
    const bb = node.firstChild.getBBox();
    const cut = node.firstChild.tagName === "path" ? bb.height * 0.3 : 0; // a shaped room's cut corner: come in past it
    opt.room(node, { x: bb.x, y: bb.y, w: bb.width - cut, h: bb.height, side: 0, cut }, k);
  }
  p.g.appendChild(p.hl);
}

const out = document.getElementById("out");
// the glyph itself, large, for each option
const key = out.appendChild(document.createElement("div"));
key.className = "key";
for (const opt of OPTIONS) {
  const svg = el("svg", { width: 150, height: 70, viewBox: "-50 -23 100 46" }, key);
  el("rect", { x: -46, y: -20, width: 64, height: 40, rx: 5, fill: "#c87a3c", "fill-opacity": 0.22, stroke: "#c87a3c", "stroke-opacity": 0.85, "stroke-width": 1.6 }, svg);
  opt.room(svg, { x: -46, y: -20, w: 64, h: 40, side: -1 }, 2.2);
  el("text", { x: 34, y: 3, fill: "#e3eaf2", "font-size": 9, "text-anchor": "middle" }, svg).textContent = opt.key;
}
for (const opt of OPTIONS) {
  const h = out.appendChild(document.createElement("h2"));
  h.innerHTML = `${opt.title}<small>${opt.sub}</small>`;
  const row = out.appendChild(document.createElement("div"));
  row.className = "row";
  frame(row, "Rim 11:00–3:00, in the Laundry", (m) => ring(m, opt, 0, "tiss.laundry", 1, 600), "600 wide: home");
  frame(row, "Rim, zoomed right out", (m) => ring(m, opt, 0, "tiss.laundry", 1, 1600), "1600 wide: furthest out");
  frame(row, "Inner 12:00: Freight Hall, the dock", (m) => ring(m, opt, 2, "tiss.freight", 0, 600), "600 wide: home");
  frame(row, "freighter, in her Passage", (m) => ship(m, opt, "freighter", "Old Faithful", "medium freighter", "freighter.passage"));
  frame(row, "skiff, in her cockpit", (m) => ship(m, opt, "hull-skiff", "Mule", "prospecting skiff", "hull-skiff.cockpit"));
}
document.body.dataset.ready = "1";
</script>
</body></html>
