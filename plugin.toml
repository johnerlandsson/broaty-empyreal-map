id = "broaty.empyreal-map"
name = "Empyreal Map"
version = "0.1.0"
description = "Maps for Empyreal's stations, T.I.S.S., Orrin Station, Wenna Halt, the Shallows' ten halts and the Mid's three: a turning station model over a deck plan of your floor."
language = "lua"
entry = "src/main.lua"
mallard_api_version = "1.0"
minimum_app_version = "0.28.0"
authors = ["John Erlandsson"]
license = "MIT"

[worlds]
match = ["empyreal.fly.dev:*"]

[permissions]
gmcp_access = ["mudstd.room.info", "Empyreal.Room", "Empyreal.Vehicle", "Ship.Status", "Ship.Devices", "Space.Charts", "Ship.Course", "Ship.List", "Space.Contacts", "Char.Status", "Char.Action", "Empyreal.Clock"]

[gmcp]
advertise = ["mudstd.room 1", "Empyreal.Room 1", "Empyreal.Vehicle 1", "Ship 1", "Space 1", "Char.Status 1", "Char.Action 1", "Empyreal.Clock 1"]

[panels.map]
title = "Map"
entry = "ui/map.html"
default_dock = "right"
default_size = { width = 380, height = 600 }

[settings.turn_model]
type = "bool"
default = true
label = "Turn the station to face you"
description = "Rotate the station model so your location faces the camera."

[settings.auto_view]
type = "bool"
default = true
label = "Switch views to fit what you're doing"
description = "Show the system chart while your ship travels, the lanes map while she's in a lane, the belt map as she arrives at a belt or moves in one, and the station or the view ahead while she's stopped. The buttons still switch views by hand."
